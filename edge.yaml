apiVersion: v1
kind: Service
metadata:
  name: ua-cloudpublisher
  namespace: edge
spec:
  type: LoadBalancer
  ports:
  - name: http
    targetPort: 8080
    port: 8081
  selector:
    app: ua-cloudpublisher
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ua-cloudcommander
  namespace: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ua-cloudcommander
  template:
    metadata:
      labels:
        app: ua-cloudcommander
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      containers:
      - name: ua-cloudcommander
        image: ghcr.io/opcfoundation/ua-cloudcommander:main
        imagePullPolicy: IfNotPresent
        env:
        # Broker connection (Mosquitto, TLS MQTT on 8883 with username/password auth)
        - name: BROKERNAME
          value: "mosquitto.cloud.svc.cluster.local"
        - name: BROKERPORT
          value: "8883"
        - name: USE_TLS
          value: "true"
        - name: CLIENTNAME
          value: "UACloudCommander"
        # Topic to subscribe to for incoming ua-action-request messages
        - name: TOPIC
          value: "commands/#"
        # Default topic to publish ua-action-response messages to
        - name: RESPONSE_TOPIC
          value: "responses"
        # Broker credentials (same IOT_USERNAME / IOT_PASSWORD used across the stack)
        - name: USERNAME
          value: "${IOT_USERNAME}"
        - name: PASSWORD
          value: "${IOT_PASSWORD}"
        # Credentials used to connect to the target OPC UA servers (e.g. the Edge Translator)
        - name: UA_USERNAME
          value: "${IOT_USERNAME}"
        - name: UA_PASSWORD
          value: "${IOT_PASSWORD}"
        volumeMounts:
        - name: "pki"
          mountPath: "/app/pki"
        - name: "logs"
          mountPath: "/app/logs"
      volumes:
        - name: "pki"
          hostPath:
            path: "/commander/pki"
        - name: "logs"
          hostPath:
            path: "/commander/logs"
---
# ---------------------------------------------------------------------------
# Simulated production line "Munich"
#
# A software-only factory simulation from the Digital Twin Consortium
# Manufacturing Ontologies reference solution. It runs four OPC UA servers that
# together model a production line:
#   * mes       - Manufacturing Execution System (shift schedule)
#   * assembly  - assembly station
#   * test      - test station
#   * packaging - packaging station
#
# Each station is an OPC UA server listening on port 4840. They live in their own
# "munich" namespace so their in-cluster DNS names match the OPC UA application
# URIs the stations advertise (opc.tcp://<station>.munich/), which is exactly what
# the seeded UA Cloud Publisher persistency.json subscribes to.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: munich
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mes
  namespace: munich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mes
  template:
    metadata:
      labels:
        app: mes
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      containers:
      - name: mes
        image: ghcr.io/digitaltwinconsortium/manufacturingontologies:main
        imagePullPolicy: IfNotPresent
        env:
        - name: StationType
          value: "mes"
        - name: StationURI
          value: "opc.tcp://mes.munich/"
        - name: FactoryTimeZone
          value: "Europe/Berlin"
        - name: ProductionLineName
          value: "munich"
        - name: OPCUA_USERNAME
          value: "${IOT_USERNAME}"
        - name: OPCUA_PASSWORD
          value: "${IOT_PASSWORD}"
        ports:
        - containerPort: 4840
          name: opcua
        volumeMounts:
        - name: "logs"
          mountPath: "/app/logs"
        - name: "pki"
          mountPath: "/app/pki"
      volumes:
        - name: "logs"
          hostPath:
            path: "/productionline/munich/mes/logs"
        - name: "pki"
          hostPath:
            path: "/productionline/munich/mes/pki"
---
apiVersion: v1
kind: Service
metadata:
  name: mes
  namespace: munich
spec:
  ports:
  - name: opcua
    targetPort: 4840
