apiVersion: apps/v1
kind: Deployment
metadata:
  name: ua-cloudcommander
  namespace: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ua-cloudcommander
  template:
    metadata:
      labels:
        app: ua-cloudcommander
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      containers:
      - name: ua-cloudcommander
        image: ghcr.io/opcfoundation/ua-cloudcommander:main
        imagePullPolicy: Always
        env:
        # Broker connection (Mosquitto, TLS MQTT on 8883 with username/password auth)
        - name: BROKERNAME
          value: "mosquitto.cloud.svc.cluster.local"
        - name: BROKERPORT
          value: "8883"
        - name: USE_TLS
          value: "true"
        # Mosquitto uses a self-signed demo CA generated at deploy time (see
        # gen-certs in cloud.yaml), so chain validation cannot succeed. This
        # mirrors Telegraf's insecure_skip_verify and UA Cloud Action's
        # MQTT_TLS_INSECURE. Remove it once the broker presents a cert from a
        # CA the client trusts.
        - name: ALLOW_UNTRUSTED_BROKER_CERT
          value: "true"
        - name: CLIENTNAME
          value: "UACloudCommander"
        # Topic to subscribe to for incoming ua-action-request messages
        - name: TOPIC
          value: "commands/#"
        # Default topic to publish ua-action-response messages to
        - name: RESPONSE_TOPIC
          value: "responses"
        # Broker credentials (same IOT_USERNAME / IOT_PASSWORD used across the stack)
        - name: USERNAME
          value: "${IOT_USERNAME}"
        - name: PASSWORD
          value: "${IOT_PASSWORD}"
        # Credentials used to connect to the target OPC UA servers (e.g. the Edge Translator)
        - name: UA_USERNAME
          value: "${IOT_USERNAME}"
        - name: UA_PASSWORD
          value: "${IOT_PASSWORD}"
        # Credentials for UA Cloud Commander's OWN OPC UA server. Its
        # VerifyPassword() compares the presented user token against these two
        # variables and maps a match to SystemConfigurationIdentity (SecurityAdmin),
        # which is what the Publisher's GDS Server Push requires. Without them every
        # push is rejected with BadUserAccessDenied.
        - name: OPCUA_USERNAME
          value: "${IOT_USERNAME}"
        - name: OPCUA_PASSWORD
          value: "${IOT_PASSWORD}"
        ports:
        # UA Cloud Commander is itself an OPC UA server (StandardServer), so it can be
        # provisioned by GDS Server Push like any other server in the stack.
        - containerPort: 4840
          name: opcua
        volumeMounts:
        - name: "pki"
          mountPath: "/app/pki"
        - name: "logs"
          mountPath: "/app/logs"
      volumes:
        - name: "pki"
          hostPath:
            path: "/commander/pki"
        - name: "logs"
          hostPath:
            path: "/commander/logs"
---
apiVersion: v1
kind: Service
metadata:
  name: ua-cloudcommander
  namespace: edge
spec:
  ports:
  - name: opcua
    targetPort: 4840
    port: 4840
  selector:
    app: ua-cloudcommander
