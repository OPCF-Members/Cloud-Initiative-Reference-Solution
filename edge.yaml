apiVersion: v1
kind: Namespace
metadata:
  name: edge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ua-edgetranslator
  namespace: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ua-edgetranslator
  template:
    metadata:
      labels:
        app: ua-edgetranslator
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      containers:
      - name: ua-edgetranslator
        image: ghcr.io/opcfoundation/ua-edgetranslator:main
        imagePullPolicy: IfNotPresent
        env:
        - name: OPCUA_USERNAME
          value: "${IOT_USERNAME}"
        - name: OPCUA_PASSWORD
          value: "${IOT_PASSWORD}"
        ports:
        - containerPort: 4840
        - containerPort: 5000
        - containerPort: 5001
        - containerPort: 19520
        - containerPort: 19521
        - containerPort: 8080
        volumeMounts:
        - name: "settings"
          mountPath: "/app/settings"
        - name: "nodesets"
          mountPath: "/app/nodesets"
        - name: "pki"
          mountPath: "/app/pki"
        - name: "logs"
          mountPath: "/app/logs"
      volumes:
        - name: "settings"
          hostPath:
            path: "/translator/settings"
        - name: "nodesets"
          hostPath:
            path: "/translator/nodesets"
        - name: "pki"
          hostPath:
            path: "/translator/pki"
        - name: "logs"
          hostPath:
            path: "/translator/logs"
---
apiVersion: v1
kind: Service
metadata:
  name: ua-edgetranslator
  namespace: edge
spec:
  type: LoadBalancer
  ports:
  - name: opcua
    targetPort: 4840
    port: 4840
  - name: lorawan
    targetPort: 5000
    port: 5000
  - name: securelorawan
    targetPort: 5001
    port: 5001
  - name: ocpp
    targetPort: 19520
    port: 19520
  - name: secureocpp
    targetPort: 19521
    port: 19521
  - name: http
    targetPort: 8080
    port: 8080
  selector:
    app: ua-edgetranslator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ua-cloudpublisher
  namespace: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ua-cloudpublisher
  template:
    metadata:
      labels:
        app: ua-cloudpublisher
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      initContainers:
      # Wait until every simulated production line station is accepting OPC UA
      # connections, so the Publisher's auto-loaded persistency.json can subscribe
      # to them straight away instead of failing on first connect.
      - name: wait-for-productionline
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
          - |
            for station in mes assembly test packaging; do
              echo "Waiting for $station.munich:4840 ..."
              until nc -z -w 2 "$station.munich" 4840; do
                sleep 5
              done
              echo "$station is up"
            done
            echo "Production line 'munich' is ready"
      # Seed the broker connection / metadata configuration and the published-nodes
      # persistency on first start so the "Configuring the Broker Connection and
      # Metadata" UI steps are not needed and data flows immediately.
      # Files are only copied if the operator has not already saved settings,
      # so any later changes made through the UI are preserved.
      - name: seed-settings
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
          - |
            if [ ! -f /app/settings/settings.json ]; then
              echo "Seeding default UA Cloud Publisher settings.json"
              cp /seed/settings.json /app/settings/settings.json
            else
              echo "settings.json already present; leaving existing configuration untouched"
            fi
            if [ ! -f /app/settings/persistency.json ]; then
              echo "Seeding default UA Cloud Publisher persistency.json (Munich production line)"
              cp /seed/persistency.json /app/settings/persistency.json
            else
              echo "persistency.json already present; leaving existing published nodes untouched"
            fi
        volumeMounts:
        - name: "settings"
          mountPath: "/app/settings"
        - name: "settings-seed"
          mountPath: "/seed"
      containers:
      - name: ua-cloudpublisher
        image: ghcr.io/barnstee/ua-cloudpublisher:main
        imagePullPolicy: IfNotPresent
        env:
        - name: PUBLISHER_USERNAME
          value: "${IOT_USERNAME}"
        - name: PUBLISHER_PASSWORD
          value: "${IOT_PASSWORD}"
        - name: OPCUA_USERNAME
          value: "${IOT_USERNAME}"
        - name: OPCUA_PASSWORD
          value: "${IOT_PASSWORD}"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: "settings"
          mountPath: "/app/settings"
        - name: "pki"
          mountPath: "/app/pki"
        - name: "logs"
          mountPath: "/app/logs"
        - name: "store"
          mountPath: "/app/store"
      volumes:
        - name: "settings"
          hostPath:
            path: "/publisher/settings"
        - name: "settings-seed"
          configMap:
            name: ua-cloudpublisher-settings
            items:
              - key: settings.json
                path: settings.json
              - key: persistency.json
                path: persistency.json
        - name: "pki"
          hostPath:
            path: "/publisher/pki"
        - name: "logs"
          hostPath:
            path: "/publisher/logs"
        - name: "store"
          hostPath:
            path: "/publisher/store"
---
