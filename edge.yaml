apiVersion: v1
kind: Namespace
metadata:
  name: edge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ua-edgetranslator
  namespace: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ua-edgetranslator
  template:
    metadata:
      labels:
        app: ua-edgetranslator
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      initContainers:
      # The UA Edge Translator image runs as the non-root "app" user (USER app in
      # its Dockerfile), but the /translator/* hostPath volumes are created by
      # kubelet as root:root 0755. Without this the server cannot write its OPC UA
      # application certificate into /app/pki, so the OPC UA listener never starts
      # on 4840 - while the ASP.NET process stays alive and the pod misleadingly
      # reports 1/1 Running. Chown by NAME so we do not depend on the numeric UID.
      - name: init-chown-data
        image: ghcr.io/opcfoundation/ua-edgetranslator:main
        imagePullPolicy: Always
        securityContext:
          runAsUser: 0
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            chown -R app:app /app/settings /app/nodesets /app/pki /app/logs
            echo "Ownership of the translator hostPath volumes fixed"
        volumeMounts:
        - name: "settings"
          mountPath: "/app/settings"
        - name: "nodesets"
          mountPath: "/app/nodesets"
        - name: "pki"
          mountPath: "/app/pki"
        - name: "logs"
          mountPath: "/app/logs"
      # Wait for the simulated Modbus device so the Thing Description can be
      # onboarded successfully on the very first startup pass. The wait is BOUNDED:
      # the simulator is only a demo asset, so it must never permanently block the
      # Edge Translator (and, transitively, the Cloud Publisher). If it is not up in
      # time we start anyway - the translator retries asset connections by itself.
      - name: wait-for-modbus
        image: busybox:1.36
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Waiting for modbus-simulator.munich:502 (max 300s) ..."
            timeout 300 sh -c 'until nc -z -w 2 modbus-simulator.munich 502; do sleep 5; done' \
              && echo "Modbus simulator is up" \
              || echo "WARNING: modbus-simulator.munich:502 not reachable - starting anyway"
            exit 0
      # Seed the WoT Thing Description into the settings folder. UA Edge Translator
      # onboards every *.jsonld found there at startup. Copied only when absent so
      # assets added or edited through the UI are preserved across restarts.
      - name: seed-thing-descriptions
        image: busybox:1.36
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        args:
          - |
            if [ ! -f /app/settings/modbus-simulator.jsonld ]; then
              echo "Seeding WoT Thing Description for the Modbus simulator"
              cp /seed/modbus-simulator.jsonld /app/settings/modbus-simulator.jsonld
            else
              echo "modbus-simulator.jsonld already present; leaving existing asset untouched"
            fi
            # This container runs as root, so anything it just copied is root-owned.
            # The translator runs as the non-root "app" user (UID/GID 1000 in the
            # .NET base image) and must be able to rewrite its asset files.
            chown -R 1000:1000 /app/settings
        volumeMounts:
        - name: "settings"
          mountPath: "/app/settings"
        - name: "thing-descriptions"
          mountPath: "/seed"
      # UA Edge Translator loads its southbound protocol drivers (Modbus, BACnet,
      # OPC UA, MQTT, S7, EtherNet/IP, ...) as plain .NET assemblies from
      # /app/drivers. They ship in a separate image so the driver pack can be
      # revved independently of the server. Without this the translator starts
      # with no protocol support and cannot onboard any asset.
      - name: ua-edgetranslator-drivers
        image: ghcr.io/opcfoundation/ua-edgetranslator-drivers:main
        imagePullPolicy: Always
        command: ["/bin/sh", "-c", "cp -a /drivers/. /app/drivers/"]
        volumeMounts:
        - name: "drivers"
          mountPath: "/app/drivers"
      containers:
      - name: ua-edgetranslator
        image: ghcr.io/opcfoundation/ua-edgetranslator:main
        imagePullPolicy: Always
        env:
        - name: OPCUA_USERNAME
          value: "${IOT_USERNAME}"
        - name: OPCUA_PASSWORD
          value: "${IOT_PASSWORD}"
        ports:
        - containerPort: 4840
          name: opcua
        - containerPort: 5000
        - containerPort: 5001
        - containerPort: 19520
        - containerPort: 19521
        # Blazor diagnostics / configuration UI (DiagnosticsWebHost binds 8081).
        - containerPort: 8081
          name: http
        # The image ships a Docker HEALTHCHECK against 4840, but Kubernetes ignores
        # that - without an explicit probe the pod reports Ready while the OPC UA
        # listener may not be up at all.
        readinessProbe:
          tcpSocket:
            port: opcua
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          tcpSocket:
            port: opcua
          initialDelaySeconds: 120
          periodSeconds: 30
          failureThreshold: 5
        volumeMounts:
        - name: "settings"
          mountPath: "/app/settings"
        - name: "nodesets"
          mountPath: "/app/nodesets"
        - name: "pki"
          mountPath: "/app/pki"
        - name: "logs"
          mountPath: "/app/logs"
        - name: "drivers"
          mountPath: "/app/drivers"
      volumes:
        - name: "settings"
          hostPath:
            path: "/translator/settings"
        - name: "thing-descriptions"
          configMap:
            name: modbus-thing-description
            items:
              - key: modbus-simulator.jsonld
                path: modbus-simulator.jsonld
        - name: "nodesets"
          hostPath:
            path: "/translator/nodesets"
        - name: "pki"
          hostPath:
            path: "/translator/pki"
        - name: "logs"
          hostPath:
            path: "/translator/logs"
        # Populated by the ua-edgetranslator-drivers init container on every pod
        # start, so the driver pack always matches the image that was pulled.
        - name: "drivers"
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ua-edgetranslator
  namespace: edge
spec:
  type: LoadBalancer
  ports:
  - name: opcua
    targetPort: 4840
    port: 4840
  - name: lorawan
    targetPort: 5000
    port: 5000
  - name: securelorawan
    targetPort: 5001
    port: 5001
  - name: ocpp
    targetPort: 19520
    port: 19520
  - name: secureocpp
    targetPort: 19521
    port: 19521
  - name: http
    targetPort: 8081
    port: 8080
  selector:
    app: ua-edgetranslator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ua-cloudpublisher
  namespace: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ua-cloudpublisher
  template:
    metadata:
      labels:
        app: ua-cloudpublisher
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      initContainers:
      # Wait until every simulated production line station is accepting OPC UA
      # connections, so the Publisher's auto-loaded persistency.json can subscribe
      # to them straight away instead of failing on first connect.
      - name: wait-for-productionline
        image: busybox:1.36
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        args:
          - |
            # NOTE: deliberately no shell variables here. This manifest is applied
            # through envsubst, which would replace an unprotected "$station" with
            # an empty string and leave the pod waiting on ".munich" forever.
            # The wait is BOUNDED so a missing station cannot block startup forever;
            # the Publisher retries its OPC UA connections by itself.
            echo "Waiting for the munich production line (max 300s) ..."
            timeout 300 sh -c 'until nc -z -w 2 mes.munich 4840 \
                                  && nc -z -w 2 assembly.munich 4840 \
                                  && nc -z -w 2 test.munich 4840 \
                                  && nc -z -w 2 packaging.munich 4840; do sleep 5; done' \
              && echo "Production line 'munich' is ready" \
              || echo "WARNING: not all munich stations reachable - starting anyway"
            exit 0
      # Wait for UA Edge Translator's OPC UA server as well: the persistency file
      # also subscribes to the Modbus asset it maps into OPC UA.
      - name: wait-for-edgetranslator
        image: busybox:1.36
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Waiting for ua-edgetranslator.edge:4840 (max 300s) ..."
            timeout 300 sh -c 'until nc -z -w 2 ua-edgetranslator.edge 4840; do sleep 5; done' \
              && echo "UA Edge Translator is up" \
              || echo "WARNING: ua-edgetranslator.edge:4840 not reachable - starting anyway"
            exit 0
      # Seed the broker connection / metadata configuration and the published-nodes
      # persistency on first start so the "Configuring the Broker Connection and
      # Metadata" UI steps are not needed and data flows immediately.
      # Files are only copied if the operator has not already saved settings,
      # so any later changes made through the UI are preserved.
      - name: seed-settings
        image: busybox:1.36
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        args:
          - |
            if [ ! -f /app/settings/settings.json ]; then
              echo "Seeding default UA Cloud Publisher settings.json"
              cp /seed/settings.json /app/settings/settings.json
            else
              echo "settings.json already present; leaving existing configuration untouched"
            fi
            if [ ! -f /app/settings/persistency.json ]; then
              echo "Seeding default UA Cloud Publisher persistency.json (Munich production line)"
              cp /seed/persistency.json /app/settings/persistency.json
            else
              echo "persistency.json already present; leaving existing published nodes untouched"
            fi
        volumeMounts:
        - name: "settings"
          mountPath: "/app/settings"
        - name: "settings-seed"
          mountPath: "/seed"
      containers:
      - name: ua-cloudpublisher
        image: ghcr.io/barnstee/ua-cloudpublisher:main
        imagePullPolicy: Always
        env:
        - name: PUBLISHER_USERNAME
          value: "${IOT_USERNAME}"
        - name: PUBLISHER_PASSWORD
          value: "${IOT_PASSWORD}"
        - name: OPCUA_USERNAME
          value: "${IOT_USERNAME}"
        - name: OPCUA_PASSWORD
          value: "${IOT_PASSWORD}"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: "settings"
          mountPath: "/app/settings"
        - name: "pki"
          mountPath: "/app/pki"
        - name: "logs"
          mountPath: "/app/logs"
        - name: "store"
          mountPath: "/app/store"
      volumes:
        - name: "settings"
          hostPath:
            path: "/publisher/settings"
        - name: "settings-seed"
          configMap:
            name: ua-cloudpublisher-settings
            items:
              - key: settings.json
                path: settings.json
              - key: persistency.json
                path: persistency.json
        - name: "pki"
          hostPath:
            path: "/publisher/pki"
        - name: "logs"
          hostPath:
            path: "/publisher/logs"
        - name: "store"
          hostPath:
            path: "/publisher/store"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ua-cloudpublisher-settings
  namespace: edge
data:
  # Pre-populated UA Cloud Publisher configuration that points the publisher at
  # the in-cluster Mosquitto broker (TLS, 8883) and enables OPC UA metadata
  # messages. Credentials are substituted from ${IOT_USERNAME}/${IOT_PASSWORD}
  # at apply time (envsubst), matching the rest of the stack.
  # AllowUntrustedBrokerCertificate is required because Mosquitto uses a
  # self-signed demo CA generated at deploy time (see gen-certs in cloud.yaml);
  # this mirrors Telegraf's insecure_skip_verify and UA Cloud Action's
  # MQTT_TLS_INSECURE. Replace the broker cert with one from a trusted CA and
  # set this back to false for production.
  settings.json: |
    {
      "PublisherName": "UACloudPublisher",
      "BrokerUrl": "mosquitto.cloud.svc.cluster.local",
      "BrokerPort": 8883,
      "BrokerUsername": "${IOT_USERNAME}",
      "BrokerPassword": "${IOT_PASSWORD}",
      "BrokerMessageTopic": "data",
      "BrokerMetadataTopic": "metadata",
      "SendUAMetadata": true,
      "UseTLS": true,
      "AllowUntrustedBrokerCertificate": true,
      "UseKafka": false,
      "CreateBrokerSASToken": false,
      "UseUACertAuth": false,
      "UseCustomCertAuth": false,
      "UseAltBrokerForMetadata": false,
      "AltBrokerUrl": null,
      "AltBrokerPort": 8883,
      "AltBrokerUsername": null,
      "AltBrokerPassword": null,
      "SendUAStatus": false,
      "SendUAConnection": true,
      "SendDiagnosticsMessages": true,
      "MetadataSendInterval": 300,
      "BrokerCommandTopic": null,
      "BrokerDataReceivedTopic": null,
      "BrokerResponseTopic": null,
      "BrokerMessageSize": 262144,
      "UseReverseConnect": false,
      "AutoPublishAllWoTProperties": true,
      "PushCertsBeforePublishing": true,
      "InternalQueueCapacity": 1000,
      "DefaultSendIntervalSeconds": 1,
      "DiagnosticsLoggingInterval": 30,
      "DefaultOpcSamplingInterval": 500,
      "DefaultOpcPublishingInterval": 1000,
      "UAStackTraceMask": 645,
      "ReversiblePubSubEncoding": false,
      "OmitNetworkMessageHeader": false,
      "UseCloudEventsMetadataHeader": false,
      "AutoLoadPersistedNodes": true,
      "AzureOpenAIAPIEndpoint": null,
      "AzureOpenAIAPIKey": null,
      "AzureOpenAIDeploymentName": null
    }
  # Published-nodes persistency seeded so the Publisher immediately subscribes to
  # the simulated Munich production line stations (auto-loaded because
  # AutoLoadPersistedNodes is true above).
  #
  # The production line stations accept anonymous sessions for reading, but the
  # UA Edge Translator requires a user token for its node subscriptions, so that
  # endpoint uses UsernamePassword with the shared IOT credentials. Note the
  # Publisher stores this password encrypted with its issuer certificate when it is
  # written from the UI, but on load DecryptString() falls back to using the value
  # verbatim when it is not valid Base64 - which is what makes a seeded plaintext
  # password work here.
  #
  # UA Cloud Commander is listed as well. It is itself an OPC UA server
  # (Opc.Ua.Cloud.Commander.UAServer derives from StandardServer) but exposes no
  # custom address space, so the only node subscribed is the standard
  # Server_ServerStatus_State (i=2259) - a liveness signal. The real purpose of the
  # entry is to make the Publisher include it in the GDS Server Push loop, which
  # only iterates the endpoints found in this file, so the Commander gets a
  # CA-issued certificate and issuer list like every other server in the stack.
  persistency.json: |
    [
      {
        "EndpointUrl": "opc.tcp://mes.munich/",
        "OpcNodes": [
          {
            "Id": "nsu=http://opcfoundation.org/UA/Station-MES/;s=Morning",
            "OpcSamplingInterval": 500,
            "OpcPublishingInterval": 1000,
            "HeartbeatInterval": 0,
            "SkipFirst": false
          },
          {
            "Id": "nsu=http://opcfoundation.org/UA/Station-MES/;s=Afternoon",
            "OpcSamplingInterval": 500,
            "OpcPublishingInterval": 1000,
            "HeartbeatInterval": 0,
            "SkipFirst": false
          },
          {
            "Id": "nsu=http://opcfoundation.org/UA/Station-MES/;s=Night",
            "OpcSamplingInterval": 500,
            "OpcPublishingInterval": 1000,
            "HeartbeatInterval": 0,
            "SkipFirst": false
          }
        ],
        "OpcEvents": [],
        "OpcAuthenticationMode": "Anonymous"
      },
      {
        "EndpointUrl": "opc.tcp://assembly.munich/",
        "OpcNodes": [
          {
            "Id": "nsu=http://opcfoundation.org/UA/Station/;i=379",
            "OpcSamplingInterval": 500,
            "OpcPublishingInterval": 1000,
            "HeartbeatInterval": 0,
            "SkipFirst": false
          },
          {
            "Id": "nsu=http://opcfoundation.org/UA/Station/;i=385",
            "OpcSamplingInterval": 500,
            "OpcPublishingInterval": 1000,
            "HeartbeatInterval": 0,
            "SkipFirst": false
          },
          {
            "Id": "nsu=http://opcfoundation.org/UA/Station/;i=391",
            "OpcSamplingInterval": 500,
            "OpcPublishingInterval": 1000,
            "HeartbeatInterval": 0,
            "SkipFirst": false
          },
          {
            "Id": "nsu=http://opcfoundation.org/UA/Station/;i=398",
            "OpcSamplingInterval": 500,
            "OpcPublishingInterval": 1000,
            "HeartbeatInterval": 0,
            "SkipFirst": false
          },
          {
