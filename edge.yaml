            "Id": "nsu=http://opcfoundation.org/UA/modbus-simulator/;s=Running",
            "OpcSamplingInterval": 500,
            "OpcPublishingInterval": 1000,
            "HeartbeatInterval": 0,
            "SkipFirst": false
          },
          {
            "Id": "nsu=http://opcfoundation.org/UA/modbus-simulator/;s=FaultActive",
            "OpcSamplingInterval": 500,
            "OpcPublishingInterval": 1000,
            "HeartbeatInterval": 0,
            "SkipFirst": false
          }
        ],
        "OpcEvents": [],
        "OpcAuthenticationMode": "UsernamePassword",
        "UserName": "${IOT_USERNAME}",
        "Password": "${IOT_PASSWORD}"
      },
      {
        "EndpointUrl": "opc.tcp://ua-cloudcommander.edge.svc.cluster.local:4840",
        "OpcNodes": [
          {
            "Id": "i=2259",
            "OpcSamplingInterval": 5000,
