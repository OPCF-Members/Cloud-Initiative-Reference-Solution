apiVersion: apps/v1
kind: Deployment
metadata:
  name: ua-edgetranslator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ua-edgetranslator
  template:
    metadata:
      labels:
        app: ua-edgetranslator
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      containers:
      - name: ua-edgetranslator
        image: ghcr.io/opcfoundation/ua-edgetranslator:main
        imagePullPolicy: IfNotPresent
        env:
        - name: OPCUA_USERNAME
          value: "${IOT_USERNAME}"
        - name: OPCUA_PASSWORD
          value: "${IOT_PASSWORD}"
        ports:
        - containerPort: 4840
        - containerPort: 5000
        - containerPort: 5001
        - containerPort: 19520
        - containerPort: 19521
        - containerPort: 8080
        volumeMounts:
        - name: "settings"
          mountPath: "/app/settings"
        - name: "nodesets"
          mountPath: "/app/nodesets"
        - name: "pki"
          mountPath: "/app/pki"
        - name: "logs"
          mountPath: "/app/logs"
      volumes:
        - name: "settings"
          hostPath:
            path: "/translator/settings"
        - name: "nodesets"
          hostPath:
            path: "/translator/nodesets"
        - name: "pki"
          hostPath:
            path: "/translator/pki"
        - name: "logs"
          hostPath:
            path: "/translator/logs"
---
apiVersion: v1
kind: Service
metadata:
  name: ua-edgetranslator
spec:
  type: LoadBalancer
  ports:
  - name: opcua
    targetPort: 4840
    port: 4840
  - name: lorawan
    targetPort: 5000
    port: 5000
  - name: securelorawan
    targetPort: 5001
    port: 5001
  - name: ocpp
    targetPort: 19520
    port: 19520
  - name: secureocpp
    targetPort: 19521
    port: 19521
  - name: http
    targetPort: 8080
    port: 8080
  selector:
    app: ua-edgetranslator
---
