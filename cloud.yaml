apiVersion: v1
kind: Namespace
metadata:
  name: cloud
---
apiVersion: v1
kind: Secret
metadata:
  name: influxdb-auth
  namespace: cloud
type: Opaque
stringData:
  INFLUX_TOKEN: "${INFLUX_TOKEN}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: telegraf-conf
  namespace: cloud
data:
  telegraf.conf: |
    [global_tags]
      env = "dev"

    [agent]
      # mqtt_consumer is a SERVICE input: messages are pushed to the accumulator
      # asynchronously, so a 1s gather interval bought nothing and just produced
      # "Collection took longer than expected" spam once the Pi was loaded -
      # immediately before Telegraf began thrashing its own MQTT connection
      # (reconnecting every ~80s and delivering nothing).
      interval = "10s"
      round_interval = true
      metric_batch_size = 1000
      # 2000 was far too small: at 1Hz across ~58 writers any InfluxDB stall
      # overflowed the buffer and metrics were silently dropped.
      metric_buffer_limit = 100000
      collection_jitter = "0s"
      flush_interval = "5s"
      flush_jitter = "0s"
      logfile = ""
      omit_hostname = false

    ##################################################################################
    # MQTT â†’ consume OPC UA PubSub JSON data messages and parse it on ingest (json_v2)
    ##################################################################################
    [[inputs.mqtt_consumer]]
      servers = ["ssl://mosquitto.cloud.svc.cluster.local:8883"]
      topics  = ["data/#"]
      qos     = 1
      client_id = "telegraf-mqtt-data"
      username = "${IOT_USERNAME}"
      password = "${IOT_PASSWORD}"
      insecure_skip_verify = true
      connection_timeout = "30s"
      # Clean sessions (the old "false") meant the broker discarded anything
      # published while Telegraf was away - and Telegraf was reconnecting ~45
      # times an hour. With a persistent session the broker queues QoS-1
      # messages for this client_id instead, so restarts stop losing data.
      persistent_session = true

      # Keep the MQTT topic as a tag (useful for filtering/debugging)
      topic_tag = "mqtt_topic"

      # Parse payload as json_v2
      data_format = "json_v2"

      [[inputs.mqtt_consumer.json_v2]]
        # Measurement name for parsed points
        measurement_name = "opcua_pubsub"

        # Top-level PublisherId -> tag "publisher"
        [[inputs.mqtt_consumer.json_v2.tag]]
          path     = "PublisherId"
          rename   = "publisher"
          optional = false

        # NOTE: MessageId is deliberately NOT mapped here. It is unique for every
        # single message, so tagging it made InfluxDB create a brand new series
        # per message (~86k/day from this 1Hz input alone). That cardinality
        # explosion - not query shape or disk speed - is what made every Grafana
        # panel slow and drove InfluxDB's memory up. Tags must be low-cardinality.
        # If you ever need the id back, add it as a *field*, never as a tag.

        # Parse the array Messages[] into one metric per element
        [[inputs.mqtt_consumer.json_v2.object]]
          path = "Messages"

          # Use inner timestamp as point time (_time)  âœ…
          timestamp_key    = "Timestamp"
          timestamp_format = "2006-01-02T15:04:05.999999999Z07:00"

          # Keep nested prefixes so you get fields like Payload_ConnectedToBroker_Value
          disable_prepend_keys = false

          # Include DataSetWriterId as a TAG âœ…
          tags = ["DataSetWriterId"]

          [inputs.mqtt_consumer.json_v2.object.renames]
            DataSetWriterId = "datasetWriterId"

    ###########################################################################
    # UA-METADATA messages (ua-metadata)
    #
    # One message describes metadata for a given DataSetWriterId.
    # We'll store it as measurement "opcua_metadata".
    #
    # We:
    #   - use top-level Timestamp as _time via timestamp_path
    #   - keep PublisherId + DataSetWriterId as tags
    #   - extract MetaData.Name and first Field details (Fields[0].*)
    ###########################################################################
    [[inputs.mqtt_consumer]]
      servers = ["ssl://mosquitto.cloud.svc.cluster.local:8883"]
      topics  = ["metadata"]
      qos     = 1
      client_id = "telegraf-mqtt-metadata"
      username = "${IOT_USERNAME}"
      password = "${IOT_PASSWORD}"
      insecure_skip_verify = true
      connection_timeout = "30s"
      # See the note on the data input above.
      persistent_session = true
      topic_tag = "mqtt_topic"

      data_format = "json_v2"

      [[inputs.mqtt_consumer.json_v2]]
        measurement_name = "opcua_metadata"

        # Use the inner Timestamp as point time (_time)
        timestamp_path    = "Timestamp"
        timestamp_format  = "2006-01-02T15:04:05.999999999Z07:00"

        # Tags
        [[inputs.mqtt_consumer.json_v2.tag]]
          path     = "PublisherId"
          rename   = "publisher"
          optional = false

        [[inputs.mqtt_consumer.json_v2.tag]]
          path     = "DataSetWriterId"
          rename   = "datasetWriterId"
          # The metadata topic carries more than ua-metadata: the Publisher also
          # sends ua-status (every DiagnosticsLoggingInterval) and ua-connection
          # messages through the same sink (SendMetadataAsync in
          # MessageProcessor.cs). Those describe the Publisher itself, not a
          # DataSetWriter, so they have no top-level DataSetWriterId and a
          # mandatory path made json_v2 reject the whole message with
          #   Error in plugin: the path "DataSetWriterId" doesn't exist
          # once per message. Marking it optional lets the ua-metadata messages
          # parse normally; the status/connection messages then contribute no
          # tag, and are dropped by the filter below.
          optional = true

        # NOTE: MessageId is deliberately NOT mapped here - see the comment in the
        # data input above. It is unique per message and tagging it created one
        # InfluxDB series per metadata message, which is why scanning
        # opcua_metadata (87k points over 2 days) was so expensive in every panel.

        # Metadata name (this can be long; tag is convenient for filtering,
        # but if you worry about cardinality, switch this to a field below.)
        [[inputs.mqtt_consumer.json_v2.tag]]
          path     = "MetaData.Name"
          rename   = "metaName"
          optional = true

        # Fields[0] information (first field in the metadata Fields array)
        [[inputs.mqtt_consumer.json_v2.tag]]
          path     = "MetaData.Fields.0.Name"
          rename   = "fieldName"
          optional = true

        [[inputs.mqtt_consumer.json_v2.tag]]
          path     = "MetaData.Fields.0.Description"
          rename   = "fieldDescription"
          optional = true

        # Store these as numeric fields
        [[inputs.mqtt_consumer.json_v2.field]]
          path     = "MetaData.Fields.0.BuiltInType"
          rename   = "builtInType"
          type     = "int"
          optional = true

        [[inputs.mqtt_consumer.json_v2.field]]
          path     = "MetaData.Fields.0.DataType.Id"
          rename   = "dataTypeId"
          type     = "int"
          optional = true

        [[inputs.mqtt_consumer.json_v2.field]]
          path     = "MetaData.Fields.0.ValueRank"
          rename   = "valueRank"
          type     = "int"
          optional = true

        [[inputs.mqtt_consumer.json_v2.field]]
          path     = "MetaData.Fields.0.FieldFlags"
          rename   = "fieldFlags"
          type     = "int"
          optional = true

        # ConfigurationVersion (useful for detecting schema changes)
        [[inputs.mqtt_consumer.json_v2.field]]
          path     = "MetaData.ConfigurationVersion.MajorVersion"
          rename   = "cfgMajor"
          type     = "int"
          optional = true

        [[inputs.mqtt_consumer.json_v2.field]]
          path     = "MetaData.ConfigurationVersion.MinorVersion"
          rename   = "cfgMinor"
          type     = "int"
          optional = true

    ###########################################################################
    # Drop the ua-status / ua-connection messages that share the metadata topic.
    #
    # They describe the Publisher itself rather than a DataSetWriter, so they
    # produce a point with no datasetWriterId and no MetaData.* values - nothing
    # the dashboards or UA Cloud Action can join on. Writing them would add
    # useless series to the opcua_metadata measurement and make the writer
    # lookups scan more points than necessary.
    #
    # ua-metadata messages always carry a datasetWriterId tag; status and
    # connection messages do not, so requiring the tag selects exactly the
    # metadata messages.
    ###########################################################################
    [[processors.filter]]
      namepass = ["opcua_metadata"]
      order = 1

      # A rule's tag criteria require the key to EXIST (and one value to match),
      # so this cannot be written as a "drop metrics without the tag" rule.
      # Instead: pass anything that has a datasetWriterId, and default-drop the
      # rest - which is exactly the ua-status / ua-connection messages.
      default = "drop"

      [[processors.filter.rule]]
        action = "pass"
        tags = { datasetWriterId = ["*"] }

    ###########################################################################
    # Output â†’ InfluxDB v2
    ###########################################################################
    [[outputs.influxdb_v2]]
      urls = ["http://influxdb.cloud.svc.cluster.local:8086"]
      token = "$INFLUX_TOKEN"
      organization = "iot"
      bucket = "mqtt"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-conf
  namespace: cloud
data:
  mosquitto.conf: |
    pid_file /mosquitto/mosquitto.pid
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout
    allow_anonymous false
    password_file /mosquitto/data/passwd
    listener 8883
    cafile /mosquitto/certs/ca.crt
    certfile /mosquitto/certs/server.crt
    keyfile /mosquitto/certs/server.key
    # Mosquitto defaults max_keepalive to 60s and, under MQTT 5.0, silently
    # overrides any larger client request via the CONNACK "Server Keep Alive"
    # property. UA Cloud Publisher asks for 100s (see MQTTClient.cs) and keeps
    # pinging on that schedule, so the broker stops seeing PINGREQ in time and
    # evicts the session with a clean "NormalDisconnection" every ~30s. Allow the
    # longer interval so long-lived publisher sessions are not torn down.
    max_keepalive 120
    # Telegraf now uses persistent sessions, so the broker queues QoS-1 messages
    # for it while it is disconnected. The default max_queued_messages of 1000 is
    # only ~16s of traffic at this rate, which would make a restart lossy anyway.
    max_queued_messages 200000
    # TLS + username/password authentication are enabled. For production,
    # replace the self-signed certificates with ones from a trusted CA.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: cloud
spec:
  replicas: 1
  # Single instance with a hostPath volume: the default RollingUpdate strategy
  # starts the replacement pod BEFORE terminating the old one, so both briefly
  # share the same host directory. Recreate terminates first, then starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      initContainers:
        - name: init-chown-data
          image: busybox:1.38
          imagePullPolicy: Always
          command: ["/bin/sh", "-c", "chown -R 1883:1883 /mosquitto/data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: mosquitto-data
              mountPath: /mosquitto/data
        - name: gen-certs
          image: alpine/openssl:3.5.7
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cd /certs
              # IDEMPOTENT: only generate if we do not already have a cert. These
              # files live on a hostPath, so they now survive pod restarts.
              # Previously this ran unconditionally against an emptyDir, so EVERY
              # broker restart minted a brand new CA and server certificate and
              # handed every client a different identity - tearing down all
              # established TLS sessions at once and showing up in the clients as
              # "Disconnected from MQTT broker" with assorted reason codes.
              if [ -s ca.crt ] && [ -s server.crt ] && [ -s server.key ]; then
                echo "Existing broker certificates found; reusing them."
                exit 0
              fi
              echo "No broker certificates present; generating a new set."
              # Self-signed CA
              openssl req -new -x509 -days 3650 -nodes \
                -subj "/CN=Mosquitto Demo CA" \
                -keyout ca.key -out ca.crt
              # Server key + CSR
              openssl genrsa -out server.key 2048
              openssl req -new -key server.key \
                -subj "/CN=mosquitto.cloud.svc.cluster.local" \
                -out server.csr
              # Sign the server cert with SANs for in-cluster and local access
              printf "subjectAltName=DNS:mosquitto,DNS:mosquitto.cloud,DNS:mosquitto.cloud.svc,DNS:mosquitto.cloud.svc.cluster.local,DNS:localhost,IP:127.0.0.1\n" > san.cnf
              openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key \
                -CAcreateserial -days 3650 -out server.crt -extfile san.cnf
              chmod 644 ca.crt server.crt server.key
          volumeMounts:
            - name: mosquitto-certs
              mountPath: /certs
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.1.2-alpine
          imagePullPolicy: Always
          env:
            - name: MOSQUITTO_USERNAME
              value: "${IOT_USERNAME}"
            - name: MOSQUITTO_PASSWORD
              value: "${IOT_PASSWORD}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # Generate the password file, then hand it to the uid the broker drops
              # privileges to. mosquitto.conf has no "user" directive, so Mosquitto
              # switches to the "mosquitto" user (uid/gid 1883) AFTER reading the config
              # and re-opens password_file as that user. mosquitto_passwd creates the
              # file 0600 owned by whoever runs this script, so without the chown/chmod
              # below the broker fails with:
              #   Error: Unable to open pwfile "/mosquitto/data/passwd".
              #
              # Mosquitto 2.1 CHANGED mosquitto_passwd -c: it now refuses to overwrite
              # an existing file, failing with
              #   Error: Unable to open file /mosquitto/data/passwd for writing. File exists.
              # whereas 2.0 replaced it silently. /mosquitto is a hostPath, so the file
              # survives pod restarts - delete it first so the credentials are always
              # regenerated from MOSQUITTO_USERNAME/MOSQUITTO_PASSWORD and stay in sync
              # with whatever was supplied at apply time.
              rm -f /mosquitto/data/passwd
              mosquitto_passwd -b -c /mosquitto/data/passwd "$MOSQUITTO_USERNAME" "$MOSQUITTO_PASSWORD"
              chown 1883:1883 /mosquitto/data/passwd || true
              chmod 0640 /mosquitto/data/passwd
              exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
          ports:
            - containerPort: 8883
              name: mqtts
          volumeMounts:
            - name: mosquitto-conf
              mountPath: /mosquitto/config
            - name: mosquitto-data
              mountPath: /mosquitto/data
            - name: mosquitto-certs
              mountPath: /mosquitto/certs
          livenessProbe:
            tcpSocket:
              port: mqtts
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: mqtts
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: mosquitto-conf
          configMap:
            name: mosquitto-conf
            items:
              - key: mosquitto.conf
                path: mosquitto.conf
        - name: mosquitto-data
          hostPath:
            path: "/mosquitto"
        - name: mosquitto-certs
          # hostPath (not emptyDir) so the broker keeps the SAME TLS identity
          # across restarts. With an emptyDir every restart produced a new CA and
          # server cert, disconnecting every MQTT client simultaneously.
          hostPath:
            path: "/mosquitto/certs"
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: cloud
spec:
  type: LoadBalancer
  selector:
    app: mosquitto
  ports:
    - name: mqtts
      port: 8883
      targetPort: 8883
---
# ---------------------------------------------------------------------------
# MQTT Explorer - the web UI for the Mosquitto broker.
#
# Mosquitto itself has no user interface, so this provides one: browse the live
# topic tree, inspect the OPC UA PubSub payloads flowing on data/# and metadata,
# and hand-craft messages - most usefully for exercising UA Cloud Commander on
# the commands/responses topics without needing mosquitto_pub on a terminal.
#
# The broker connection is pre-seeded via INITIAL_CONFIG (see the ConfigMap
# below), so the Mosquitto host, port, credentials and topic subscriptions are
# already filled in when the UI first loads.
#
# SECURITY: unlike the other UIs in this stack, MQTT Explorer has NO built-in
# authentication, and anyone who reaches it can publish arbitrary messages to the
# broker - including commands/# which UA Cloud Commander will execute against
# your OPC UA servers. Keep it on a trusted network, put it behind an
# authenticating reverse proxy, or scale it to 0 when not in use:
#     kubectl scale deployment/mqtt-explorer -n cloud --replicas=0
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: mqtt-explorer-config
  namespace: cloud
data:
  # Seeds MQTT Explorer's lowdb settings store. The key and shape are taken from
  # the image's own source: ConfigStorage writes <CONFIG_PATH>/settings.json, and
  # ConnectionManager.ts persists the connection dictionary under the storage id
  # "ConnectionManager_connections"; each entry is a ConnectionOptions record
  # (app/src/model/ConnectionOptions.ts).
  #
  # certValidation is false because the broker presents the self-signed
  # certificate generated by the gen-certs init container - the same reason
  # Telegraf sets insecure_skip_verify and UA Cloud Action sets
  # MQTT_TLS_INSECURE.
  settings.json: |
    {
      "ConnectionManager_connections": {
        "mosquitto": {
          "configVersion": 1,
          "type": "mqtt",
          "id": "mosquitto",
          "name": "Mosquitto (this cluster)",
          "host": "mosquitto.cloud.svc.cluster.local",
          "port": 8883,
          "protocol": "mqtt",
          "encryption": true,
          "certValidation": false,
          "username": "${IOT_USERNAME}",
          "password": "${IOT_PASSWORD}",
          "clientId": "mqtt-explorer",
          "subscriptions": [
            {
              "topic": "#",
              "qos": 0
            }
          ]
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-explorer
  namespace: cloud
spec:
  replicas: 1
  # Single instance; terminate before starting the replacement, matching the
  # convention used by the rest of this stack.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mqtt-explorer
  template:
    metadata:
      labels:
        app: mqtt-explorer
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      initContainers:
        # CONFIG_PATH must be writable (the app rewrites settings.json whenever a
        # connection is edited in the UI), so the seed is copied out of the
        # read-only ConfigMap mount into an emptyDir.
        - name: seed-config
          image: busybox:1.38
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              if [ -s /config/settings.json ]; then
                echo "settings.json already present; leaving user edits intact."
                exit 0
              fi
              cp /seed/settings.json /config/settings.json
              echo "Seeded MQTT Explorer with the Mosquitto connection."
          volumeMounts:
            - name: seed
              mountPath: /seed
            - name: config
              mountPath: /config
      containers:
        - name: mqtt-explorer
          image: smeagolworms4/mqtt-explorer:browser-1.0.3
          imagePullPolicy: IfNotPresent
          env:
            - name: HTTP_PORT
              value: "4000"
            - name: CONFIG_PATH
              value: "/mqtt-explorer/config"
          volumeMounts:
            - name: config
              mountPath: /mqtt-explorer/config
          ports:
            - containerPort: 4000
              name: http
          # Modest footprint so the UI can never starve the data pipeline.
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: seed
          configMap:
            name: mqtt-explorer-config
        # Writable copy: the app rewrites settings.json when connections are
        # edited in the UI. Edits are intentionally not persisted across restarts
        # so the pod always comes back with the provisioned connection.
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mqtt-explorer
  namespace: cloud
spec:
  type: LoadBalancer
  selector:
    app: mqtt-explorer
  ports:
    - name: http
      port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: influxdb
  namespace: cloud
spec:
  replicas: 1
  # InfluxDB is a single instance backed by the hostPath /influxdb2 and takes an
  # exclusive lock on its engine directory. The default RollingUpdate strategy
  # starts the new pod BEFORE terminating the old one, so the new pod can never
  # acquire the lock: it CrashLoopBackOffs and the rollout deadlocks forever
  # while two pods fight over the same data directory. Recreate terminates the
  # old pod first, which is the only safe option for a single-writer database on
  # a hostPath volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: influxdb
  template:
    metadata:
      labels:
        app: influxdb
    spec:
      containers:
        - name: influxdb
          image: influxdb:2.9
          imagePullPolicy: Always
          ports:
            - containerPort: 8086
              name: http
          env:
            # Optional first-run setup via env vars (if not using the UI)
            - name: INFLUXD_REPORTING_DISABLED
              value: "true"
            - name: DOCKER_INFLUXDB_INIT_MODE
              value: "setup"
            - name: DOCKER_INFLUXDB_INIT_USERNAME
              value: "${IOT_USERNAME}"
            - name: DOCKER_INFLUXDB_INIT_PASSWORD
              value: "${IOT_PASSWORD}"
            - name: DOCKER_INFLUXDB_INIT_ORG
              value: "iot"
            - name: DOCKER_INFLUXDB_INIT_BUCKET
              value: "mqtt"
            # Bound the bucket's lifetime. Without this the bucket is created with
            # INFINITE retention, so nothing ever ages out - which meant the series
            # created by the old messageId tag (one series per message) would have
            # polluted the index forever. NOTE: this only applies when InfluxDB
            # first initialises (INIT_MODE=setup); it does NOT alter an existing
            # bucket. To change retention on a live bucket use:
            #   influx bucket update --name mqtt --org iot --retention 30d
            - name: DOCKER_INFLUXDB_INIT_RETENTION
              value: "30d"
            - name: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: influxdb-auth
                  key: INFLUX_TOKEN
          volumeMounts:
            - name: data
              mountPath: /var/lib/influxdb2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: "data"
          hostPath:
            path: "/influxdb2"
---
apiVersion: v1
kind: Service
metadata:
  name: influxdb
  namespace: cloud
spec:
  type: LoadBalancer
  selector:
    app: influxdb
  ports:
    - name: http
      port: 8086
      targetPort: 8086
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegraf
  namespace: cloud
spec:
  replicas: 1
  # Both mqtt_consumer inputs use a FIXED client_id (telegraf-mqtt-data /
  # telegraf-mqtt-metadata). MQTT allows only one session per client id, so the
  # broker disconnects the older client the moment a second one connects with
  # the same id. The default RollingUpdate strategy starts the replacement pod
  # BEFORE terminating the old one, so during every rollout two pods fight over
  # the same two client ids and each kicks the other off in a loop - visible as
  #   Connected [ssl://mosquitto...] / Error in plugin: connection lost: EOF
  # repeating every few seconds, with no data reaching InfluxDB.
  # Recreate terminates the old pod first, so the ids are never contended.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: telegraf
  template:
    metadata:
      labels:
        app: telegraf
    spec:
      initContainers:
        - name: wait-for-mosquitto
          image: busybox:1.38
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for mosquitto:8883 (max 300s) ..."
              timeout 300 sh -c 'until nc -z -w 2 mosquitto 8883; do sleep 5; done' \
                && echo "Mosquitto is up" \
                || echo "WARNING: mosquitto:8883 not reachable - starting anyway"
              exit 0
      containers:
        - name: telegraf
          image: telegraf:1.39-alpine
          imagePullPolicy: Always
          env:
            - name: INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: influxdb-auth
                  key: INFLUX_TOKEN
          volumeMounts:
            - name: telegraf-conf
              mountPath: /etc/telegraf
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pgrep telegraf >/dev/null || exit 1"]
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "telegraf --version >/dev/null 2>&1"]
            initialDelaySeconds: 5
            periodSeconds: 20
      volumes:
        - name: telegraf-conf
          configMap:
            name: telegraf-conf
            items:
              - key: telegraf.conf
                path: telegraf.conf
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portainer-sa-clusteradmin
  namespace: cloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portainer-crb-clusteradmin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: portainer-sa-clusteradmin
  namespace: cloud
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portainer
  namespace: cloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: portainer
  template:
    metadata:
      labels:
        app: portainer
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      # Grants Portainer in-cluster access to the K3s API server to manage the cluster
      serviceAccountName: portainer-sa-clusteradmin
      containers:
      - name: portainer
        image: portainer/portainer-ce:2.44.0
        imagePullPolicy: Always
        args:
        # Use the in-cluster (Kubernetes) environment as the default endpoint
        - "--tunnel-port=8000"
        ports:
        - name: http
          containerPort: 9000
        - name: https
          containerPort: 9443
        - name: tunnel
          containerPort: 8000
        volumeMounts:
        - name: data
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /
            port: 9443
            scheme: HTTPS
          initialDelaySeconds: 20
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 9443
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 20
      volumes:
        - name: data
          hostPath:
            path: "/portainer"
---
apiVersion: v1
kind: Service
metadata:
  name: portainer
  namespace: cloud
spec:
  type: LoadBalancer
  selector:
    app: portainer
  ports:
    - name: https
      port: 9443
      targetPort: 9443
    - name: http
      port: 9000
      targetPort: 9000
    - name: tunnel
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: cloud
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: InfluxDB
        # The uid is referenced by every provisioned dashboard panel
        # ("datasource": { "type": "influxdb", "uid": "influxdb" }). Without an
        # explicit uid Grafana generates a random one and the panels resolve to a
        # non-existent datasource, so they render empty with no query ever issued.
        uid: influxdb
        type: influxdb
        access: proxy
        url: http://influxdb.cloud.svc.cluster.local:8086
        isDefault: true
        jsonData:
          version: Flux
          organization: iot
          defaultBucket: mqtt
          tlsSkipVerify: true
        secureJsonData:
          # Interpolated from the INFLUX_TOKEN environment variable at startup
          token: $INFLUX_TOKEN
