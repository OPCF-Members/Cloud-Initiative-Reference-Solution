apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: cloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      securityContext:
        fsGroup: 472
      initContainers:
        # Ensure the hostPath data dir is writable by the grafana user (uid/gid 472)
        - name: init-chown-data
          image: busybox:1.38
          imagePullPolicy: Always
          command: ["sh", "-c", "chown -R 472:472 /var/lib/grafana"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
      containers:
        - name: grafana
          image: grafana/grafana:13.1.1
          imagePullPolicy: Always
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "${IOT_USERNAME}"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "${IOT_PASSWORD}"
            # Land on the OEE dashboard instead of the empty Grafana home page.
            # The path is the one the file provisioner serves it from; the uid in
            # the dashboard JSON is "production-line-oee".
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: "/var/lib/grafana/dashboards/production-line-oee.json"
            # Consumed by the provisioned datasource (token interpolation)
            - name: INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: influxdb-auth
                  key: INFLUX_TOKEN
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          hostPath:
            path: "/grafana"
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: cloud
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ua-cloudaction
  namespace: cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ua-cloudaction
  template:
    metadata:
      labels:
        app: ua-cloudaction
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      containers:
      - name: ua-cloudaction
        image: ghcr.io/opcfoundation/ua-cloudaction:main
        imagePullPolicy: Always
        env:
        # --- Web UI / OPC UA Web API login ---
        - name: ADMIN_USERNAME
          value: "${IOT_USERNAME}"
        - name: ADMIN_PASSWORD
          value: "${IOT_PASSWORD}"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        # --- OPC UA Web API rate limiter (per client IP, fixed window) ---
        - name: RATE_LIMIT_PERMIT
          value: "60"
        - name: RATE_LIMIT_WINDOW_SECONDS
          value: "60"
        # --- Data source: query InfluxDB instead of Azure Data Explorer ---
        - name: DATA_SOURCE
          value: "InfluxDB"
        - name: INFLUX_URL
          value: "http://influxdb.cloud.svc.cluster.local:8086"
        - name: INFLUX_ORG
          value: "iot"
        - name: INFLUX_BUCKET
          value: "mqtt"
        - name: INFLUX_MEASUREMENT
          value: "opcua_pubsub"
        # Metadata measurement written by the second Telegraf mqtt_consumer input.
        # Browse joins it to INFLUX_MEASUREMENT on the "datasetWriterId" tag to
        # resolve each tag's OPC UA namespace URI from its "metaName" value.
        - name: INFLUX_METADATA_MEASUREMENT
          value: "opcua_metadata"
        # Field to evaluate and threshold that triggers the OPC UA method call.
        # Adjust INFLUX_FIELD to match a numeric field your assets publish.
        - name: INFLUX_FIELD
          value: "Payload_Pressure_Value"
        - name: INFLUX_THRESHOLD
          value: "4000"
        - name: INFLUX_RANGE
          value: "-1m"
        - name: INFLUX_TOKEN
          valueFrom:
            secretKeyRef:
              name: influxdb-auth
              key: INFLUX_TOKEN
        # --- Transport: reach UA Cloud Commander over the Mosquitto MQTT broker ---
        - name: MESSAGING_PLATFORM
          value: "MQTT"
        # Send the full OPC UA PubSub ActionRequest envelope to UA Cloud Commander (not the AIO RPC body)
        - name: MQTT_TARGET
          value: "UACloudCommander"
        - name: BROKER_NAME
          value: "mosquitto.cloud.svc.cluster.local"
        - name: MQTT_PORT
          value: "8883"
        - name: MQTT_USE_TLS
          value: "true"
        # Mosquitto uses a self-signed certificate; skip verification (matches Telegraf's insecure_skip_verify)
        - name: MQTT_TLS_INSECURE
          value: "true"
        - name: BROKER_USERNAME
          value: "${IOT_USERNAME}"
        - name: BROKER_PASSWORD
          value: "${IOT_PASSWORD}"
        # Topics UA Cloud Commander listens/responds on (it subscribes to commands, replies on responses)
        - name: TOPIC
          value: "commands"
        - name: RESPONSE_TOPIC
          value: "responses"
        - name: UA_CLOUD_COMMANDER_ID
          value: "UACloudCommander"
        - name: REQUESTOR_ID
          value: "UACloudAction"
        # --- OPC UA method to invoke on high value (target server reachable by UA Cloud Commander) ---
        # This is the assembly station's pressure-relief method
        - name: UA_SERVER_ENDPOINT
          value: "opc.tcp://assembly.munich/"
        - name: UA_SERVER_METHOD_ID
          value: "ns=2;i=435"
        - name: UA_SERVER_OBJECT_ID
          value: "ns=2;i=424"
        - name: UA_SERVER_APPLICATION_NAME
          value: "assembly"
        - name: UA_SERVER_LOCATION_NAME
          value: "munich"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ua-cloudaction
  namespace: cloud
spec:
  type: LoadBalancer
  selector:
    app: ua-cloudaction
  ports:
    - name: http
      port: 8082
      targetPort: 8080
