apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: cloud
data:
  production-line-oee.json: |
    {
      "annotations": {
        "list": [
        ]
      },
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 41,
      "title": "Production Line OEE",
      "uid": "production-line-oee",
      "tags": [
        "opcua",
        "oee",
        "manufacturing"
      ],
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "station",
            "label": "Station",
            "type": "custom",
            "query": "assembly,test,packaging",
            "current": {
              "text": "assembly",
              "value": "assembly",
              "selected": true
            },
            "options": [
              {
                "text": "assembly",
                "value": "assembly",
                "selected": true
              },
              {
                "text": "test",
                "value": "test",
                "selected": false
              },
              {
                "text": "packaging",
                "value": "packaging",
                "selected": false
              }
            ],
            "includeAll": false,
            "multi": false
          }
        ]
      },
      "panels": [
        {
          "id": 100,
          "title": "OEE - production line (bottleneck)",
          "type": "gauge",
          "datasource": {
            "type": "influxdb",
            "uid": "influxdb"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 50
                  },
                  {
                    "color": "green",
                    "value": 75
                  }
                ]
              }
            },
            "overrides": [
            ]
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "influxdb",
                "uid": "influxdb"
              },
              "query": "import \"strings\"\nimport \"array\"\nimport \"regexp\"\n\n// ---------------------------------------------------------------------------\n// Line OEE = the OEE of the BOTTLENECK station, not the mean and not the pooled\n// aggregate. This mirrors CalculateOEEForLine() in the Manufacturing Ontologies\n// reference (Tools/FabricQueries/opcua_setup.kql), which evaluates\n// CalculateOEEForStation() per workcell and then takes summarize min(oee).\n//\n// The rationale is physical: on a serial line (assembly -\u003e test -\u003e packaging)\n// the stations are coupled, so the slowest station starves everything\n// downstream and blocks everything upstream. Line throughput is therefore\n// governed by the constraint, and averaging would hide the very station you\n// need to act on.\n//\n// The reference also excludes the publisher/mes/commander workcells; here the\n// station list is explicit for the same reason.\n// ---------------------------------------------------------------------------\nidealCycleTimeMs = 6000.0\nbucket = \"mqtt\"\n\nstart = v.timeRangeStart\nstop  = v.timeRangeStop\n\n// Window length in ms. int(v: time) is nanoseconds since the epoch.\nidealRunningTimeMs = float(v: int(v: stop) - int(v: start)) / 1000000.0\n\noeeFor = (station) =\u003e {\n\n  // DataSetWriterIds belonging to this station, taken from the metadata stream.\n  // Metadata is republished every MetadataSendInterval (300s), the 2d lookback is\n  // deliberately generous: it is effectively how long the publisher may stop\n  // publishing metadata before every panel goes blank. Do not shrink it without\n  // considering that trade-off.\n  // PERF: metaName is a tag, so a regex predicate is pushed into the storage\n  // engine; strings.containsStr() was evaluated row-by-row over every metadata\n  // point in the lookback window.\n  stationRx = regexp.compile(v: station)\n\n  writers =\n    from(bucket: bucket)\n    |\u003e range(start: -2d)\n    |\u003e filter(fn: (r) =\u003e r._measurement == \"opcua_metadata\")\n    |\u003e filter(fn: (r) =\u003e r.metaName =~ stationRx)\n    |\u003e keep(columns: [\"datasetWriterId\"])\n    |\u003e group()\n    |\u003e distinct(column: \"datasetWriterId\")\n    |\u003e findColumn(fn: (key) =\u003e true, column: \"_value\")\n  // PERF: a regex predicate on a tag can be pushed into the storage engine,\n  // whereas contains() is evaluated row-by-row in Flux and blocks all pushdown.\n  writersRx = regexp.compile(v: \"^(\" + strings.joinStr(arr: writers, v: \"|\") + \")$\")\n\n  producedField = \"Payload_NumberOfManufacturedProducts_Value\"\n  scrappedField = \"Payload_NumberOfDiscardedProducts_Value\"\n  faultyField   = \"Payload_FaultyTime_Value\"\n\n  // PERF: every findRecord() call re-executes its entire upstream pipeline. The\n  // previous version grouped by _field and called findRecord() three times, so the\n  // window was scanned three times - the query plan showed three identical\n  // ReadRange branches and the query took 56s (Grafana times out at 30s).\n  // Reducing all three fields into a SINGLE row scans the window once and needs\n  // only one findRecord().\n  raw =\n    from(bucket: bucket)\n    |\u003e range(start: start, stop: stop)\n    |\u003e filter(fn: (r) =\u003e r._measurement == \"opcua_pubsub\")\n    |\u003e filter(fn: (r) =\u003e r._field == producedField or r._field == scrappedField or r._field == faultyField)\n    |\u003e filter(fn: (r) =\u003e r.datasetWriterId =~ writersRx)\n    |\u003e map(fn: (r) =\u003e ({_field: r._field, _value: float(v: r._value), seed: 0.0}))\n    |\u003e keep(columns: [\"_field\", \"_value\", \"seed\"])\n\n  // One flagged seed row keeps the table non-empty so findRecord() always returns a\n  // record (FaultyTime does not exist until the first fault occurs). It is flagged\n  // so it cannot influence any aggregate.\n  seed = array.from(rows: [{_field: \"seed\", _value: 0.0, seed: 1.0}])\n\n  stat =\n    union(tables: [raw, seed])\n    |\u003e group()\n    |\u003e reduce(\n      identity: {pMin: 0.0, pMax: 0.0, pN: 0.0, sMin: 0.0, sMax: 0.0, sN: 0.0, fSum: 0.0},\n      fn: (r, accumulator) =\u003e ({\n        pMin: if r.seed \u003e 0.0 or r._field != producedField then accumulator.pMin\n          else if accumulator.pN == 0.0 or r._value \u003c accumulator.pMin then r._value\n          else accumulator.pMin,\n        pMax: if r.seed \u003e 0.0 or r._field != producedField then accumulator.pMax\n          else if accumulator.pN == 0.0 or r._value \u003e accumulator.pMax then r._value\n          else accumulator.pMax,\n        pN:   if r.seed \u003e 0.0 or r._field != producedField then accumulator.pN\n          else accumulator.pN + 1.0,\n        sMin: if r.seed \u003e 0.0 or r._field != scrappedField then accumulator.sMin\n          else if accumulator.sN == 0.0 or r._value \u003c accumulator.sMin then r._value\n          else accumulator.sMin,\n        sMax: if r.seed \u003e 0.0 or r._field != scrappedField then accumulator.sMax\n          else if accumulator.sN == 0.0 or r._value \u003e accumulator.sMax then r._value\n          else accumulator.sMax,\n        sN:   if r.seed \u003e 0.0 or r._field != scrappedField then accumulator.sN\n          else accumulator.sN + 1.0,\n        fSum: if r.seed \u003e 0.0 or r._field != faultyField then accumulator.fSum\n          else accumulator.fSum + r._value,\n      }),\n    )\n    |\u003e findRecord(fn: (key) =\u003e true, idx: 0)\n\n  // Counters are cumulative, so the increase over the window is max - min.\n  produced = stat.pMax - stat.pMin\n  scrapped = stat.sMax - stat.sMin\n\n  // FaultyTime spikes once per fault with that fault duration, so it is summed.\n  faultyMs = stat.fSum\n\n  runTimeMs   = idealRunningTimeMs - faultyMs\n  totalPieces = produced + scrapped\n\n  availability =\n    if idealRunningTimeMs \u003e 0.0 and runTimeMs \u003e 0.0 then runTimeMs / idealRunningTimeMs\n    else 0.0\n\n  performance =\n    if runTimeMs \u003e 0.0 and totalPieces \u003e 0.0 then idealCycleTimeMs * totalPieces / runTimeMs\n    else 0.0\n\n  quality =\n    if totalPieces \u003e 0.0 then produced / totalPieces\n    else 0.0\n\n  // The simulated stations start at half their nominal cycle time\n  // (m_actualCycleTime = CycleTime * 500), so Performance legitimately exceeds 1.0\n  // and would push the gauge past 100%. Clamp here so the gauge stays in range.\n  perfClamped = if performance \u003e 1.0 then 1.0 else performance\n\n\n  return availability * perfClamped * quality * 100.0\n}\n\n// One evaluation per station on the line.\nassemblyOee  = oeeFor(station: \"assembly\")\ntestOee      = oeeFor(station: \"test\")\npackagingOee = oeeFor(station: \"packaging\")\n\n// Bottleneck: the minimum across the line.\nminAT   = if assemblyOee \u003c testOee then assemblyOee else testOee\nlineOee = if minAT \u003c packagingOee then minAT else packagingOee\n\narray.from(\n  rows: [\n  {\n\t_time: stop,\n\t_field: \"OEE\",\n\t_value: lineOee,\n  },\n  ],\n)"
            }
          ]
        },
