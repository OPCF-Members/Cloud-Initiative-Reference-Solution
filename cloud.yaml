              "refId": "A",
              "datasource": {
                "type": "influxdb",
                "uid": "influxdb"
              },
              "query": "import \"strings\"\nimport \"regexp\"\n\nstation = \"${station}\"\n\n// DataSetWriterIds belonging to this station, taken from the metadata stream.\n// Metadata is republished every MetadataSendInterval (300s), the 2d lookback is\n// deliberately generous: it is effectively how long the publisher may stop\n// publishing metadata before every panel goes blank. Do not shrink it without\n// considering that trade-off.\n// PERF: metaName is a tag, so a regex predicate is pushed into the storage\n// engine; strings.containsStr() was evaluated row-by-row over every metadata\n// point in the lookback window.\nstationRx = regexp.compile(v: station)\n\nwriters =\n  from(bucket: \"mqtt\")\n  |> range(start: -2d)\n  |> filter(fn: (r) => r._measurement == \"opcua_metadata\")\n  |> filter(fn: (r) => r.metaName =~ stationRx)\n  |> keep(columns: [\"datasetWriterId\"])\n  |> group()\n  |> distinct(column: \"datasetWriterId\")\n  |> findColumn(fn: (key) => true, column: \"_value\")\n\n// PERF: a regex predicate on a tag can be pushed into the storage engine,\n// whereas contains() is evaluated row-by-row in Flux and blocks all pushdown.\nwritersRx = regexp.compile(v: \"^(\" + strings.joinStr(arr: writers, v: \"|\") + \")$\")\n\nfrom(bucket: \"mqtt\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"opcua_pubsub\" and r._field == \"Payload_EnergyConsumption_Value\")\n  |> filter(fn: (r) => r.datasetWriterId =~ writersRx)\n  // PERF: aggregateWindow must directly follow the filters so the planner can\n  // fold it into ReadWindowAggregate. The previous keep/map/group in between\n  // blocked that and forced every raw point through the Flux interpreter.\n  |> aggregateWindow(every: v.windowPeriod, fn: last, createEmpty: false)\n  // Re-merge the per-writer results into the single series this panel showed\n  // before. last() is associative, so the rendered values are unchanged.\n  |> group()\n  |> aggregateWindow(every: v.windowPeriod, fn: last, createEmpty: false)\n  |> map(fn: (r) => ({_time: r._time, _value: float(v: r._value)}))\n  |> set(key: \"_field\", value: \"kWh\")"
            }
          ]
        },
        {
          "id": 31,
          "title": "Pressure",
          "type": "timeseries",
          "datasource": {
