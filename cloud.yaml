  # ---------------------------------------------------------------------------
  # Modbus simulator dashboard.
  #
  # This is a SEPARATE dashboard rather than another entry in the "station"
  # dropdown of production-line-oee.json on purpose: the modbus simulator is a
  # non-OPC UA device surfaced through UA Edge Translator and publishes a
  # completely different set of nodes (see the 'modbus-thing-description'
  # ConfigMap in edge.yaml). It has no OEE, Status or product-count nodes, so
  # adding it to that dropdown would leave ~10 of the 13 panels there blank.
  #
  # The writer-lookup preamble in every query is identical to the OEE dashboard
  # (metadata lookback -2d, regex pushdown on the metaName/datasetWriterId tags);
  # see the PERF comments there for why it is shaped this way.
  # ---------------------------------------------------------------------------
