  # UA Cloud Publisher diagnostics dashboard.
  #
  # The Publisher publishes its own health as OPC UA nodes under
  # nsu=http://opcfoundation.org/UA/CloudPublisher/ (Diagnostics.cs), which flow
  # through the same data/# topic as the production line telemetry. The writer
  # lookup in every panel therefore matches "CloudPublisher" in metaName rather
  # than a station name.
  #
  # These are the counters to check first when telemetry stops arriving:
  # queue depth and enqueue failures show back-pressure, send failures and
  # stored-messages show broker trouble.
