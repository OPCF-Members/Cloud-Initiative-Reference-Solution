apiVersion: v1
kind: Namespace
metadata:
  name: cloud
---
apiVersion: v1
kind: Secret
metadata:
  name: influxdb-auth
  namespace: cloud
type: Opaque
stringData:
  INFLUX_TOKEN: "${INFLUX_TOKEN}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: telegraf-conf
  namespace: cloud
data:
  telegraf.conf: |
    [global_tags]
      env = "dev"

    [agent]
      interval = "1s"
      round_interval = true
      metric_batch_size = 200
      metric_buffer_limit = 2000
      collection_jitter = "0s"
      flush_interval = "1s"
      flush_jitter = "0s"
      logfile = ""
      omit_hostname = false

    ##################################################################################
    # MQTT â†’ consume OPC UA PubSub JSON data messages and parse it on ingest (json_v2)
    ##################################################################################
    [[inputs.mqtt_consumer]]
      servers = ["ssl://mosquitto.cloud.svc.cluster.local:8883"]
      topics  = ["data/#"]
      qos     = 1
      client_id = "telegraf-mqtt-data"
      username = "${IOT_USERNAME}"
      password = "${IOT_PASSWORD}"
      insecure_skip_verify = true
      connection_timeout = "30s"
      persistent_session = false

      # Keep the MQTT topic as a tag (useful for filtering/debugging)
      topic_tag = "mqtt_topic"

      # Parse payload as json_v2
      data_format = "json_v2"

      [[inputs.mqtt_consumer.json_v2]]
        # Measurement name for parsed points
        measurement_name = "opcua_pubsub"

        # Top-level PublisherId -> tag "publisher"
        [[inputs.mqtt_consumer.json_v2.tag]]
          path     = "PublisherId"
          rename   = "publisher"
          optional = false

        # OPTIONAL: top-level MessageId as tag
        [[inputs.mqtt_consumer.json_v2.tag]]
          path     = "MessageId"
          rename   = "messageId"
          optional = true

        # Parse the array Messages[] into one metric per element
        [[inputs.mqtt_consumer.json_v2.object]]
          path = "Messages"

          # Use inner timestamp as point time (_time)  âœ…
          timestamp_key    = "Timestamp"
          timestamp_format = "2006-01-02T15:04:05.999999999Z07:00"

          # Keep nested prefixes so you get fields like Payload_ConnectedToBroker_Value
          disable_prepend_keys = false

          # Include DataSetWriterId as a TAG âœ…
          tags = ["DataSetWriterId"]

          [inputs.mqtt_consumer.json_v2.object.renames]
            DataSetWriterId = "datasetWriterId"

    ###########################################################################
    # UA-METADATA messages (ua-metadata)
    #
    # One message describes metadata for a given DataSetWriterId.
    # We'll store it as measurement "opcua_metadata".
    #
    # We:
    #   - use top-level Timestamp as _time via timestamp_path
    #   - keep PublisherId + DataSetWriterId as tags
    #   - extract MetaData.Name and first Field details (Fields[0].*)
    ###########################################################################
    [[inputs.mqtt_consumer]]
      servers = ["ssl://mosquitto.cloud.svc.cluster.local:8883"]
      topics  = ["metadata"]
      qos     = 1
      client_id = "telegraf-mqtt-metadata"
      username = "${IOT_USERNAME}"
      password = "${IOT_PASSWORD}"
      insecure_skip_verify = true
      connection_timeout = "30s"
      persistent_session = false
      topic_tag = "mqtt_topic"

      data_format = "json_v2"

      [[inputs.mqtt_consumer.json_v2]]
        measurement_name = "opcua_metadata"

        # Use the inner Timestamp as point time (_time)
        timestamp_path    = "Timestamp"
        timestamp_format  = "2006-01-02T15:04:05.999999999Z07:00"

        # Tags
        [[inputs.mqtt_consumer.json_v2.tag]]
          path     = "PublisherId"
          rename   = "publisher"
          optional = false

        [[inputs.mqtt_consumer.json_v2.tag]]
          path     = "DataSetWriterId"
          rename   = "datasetWriterId"
          optional = false

        [[inputs.mqtt_consumer.json_v2.tag]]
          path     = "MessageId"
          rename   = "messageId"
          optional = true

        # Metadata name (this can be long; tag is convenient for filtering,
        # but if you worry about cardinality, switch this to a field below.)
        [[inputs.mqtt_consumer.json_v2.tag]]
          path     = "MetaData.Name"
          rename   = "metaName"
          optional = true

        # Fields[0] information (first field in the metadata Fields array)
        [[inputs.mqtt_consumer.json_v2.tag]]
          path     = "MetaData.Fields.0.Name"
          rename   = "fieldName"
          optional = true

        [[inputs.mqtt_consumer.json_v2.tag]]
          path     = "MetaData.Fields.0.Description"
          rename   = "fieldDescription"
          optional = true

        # Store these as numeric fields
        [[inputs.mqtt_consumer.json_v2.field]]
          path     = "MetaData.Fields.0.BuiltInType"
          rename   = "builtInType"
          type     = "int"
          optional = true

        [[inputs.mqtt_consumer.json_v2.field]]
          path     = "MetaData.Fields.0.DataType.Id"
          rename   = "dataTypeId"
          type     = "int"
          optional = true

        [[inputs.mqtt_consumer.json_v2.field]]
          path     = "MetaData.Fields.0.ValueRank"
          rename   = "valueRank"
          type     = "int"
          optional = true

        [[inputs.mqtt_consumer.json_v2.field]]
          path     = "MetaData.Fields.0.FieldFlags"
          rename   = "fieldFlags"
          type     = "int"
          optional = true

        # ConfigurationVersion (useful for detecting schema changes)
        [[inputs.mqtt_consumer.json_v2.field]]
          path     = "MetaData.ConfigurationVersion.MajorVersion"
          rename   = "cfgMajor"
          type     = "int"
          optional = true

        [[inputs.mqtt_consumer.json_v2.field]]
          path     = "MetaData.ConfigurationVersion.MinorVersion"
          rename   = "cfgMinor"
          type     = "int"
          optional = true

    ###########################################################################
    # Output â†’ InfluxDB v2
    ###########################################################################
    [[outputs.influxdb_v2]]
      urls = ["http://influxdb.cloud.svc.cluster.local:8086"]
      token = "$INFLUX_TOKEN"
      organization = "iot"
      bucket = "mqtt"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-conf
  namespace: cloud
data:
  mosquitto.conf: |
    pid_file /mosquitto/mosquitto.pid
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout
    allow_anonymous false
    password_file /mosquitto/data/passwd
    listener 8883
    cafile /mosquitto/certs/ca.crt
    certfile /mosquitto/certs/server.crt
    keyfile /mosquitto/certs/server.key
    # Mosquitto 2.0 defaults max_keepalive to 60s and, under MQTT 5.0, silently
    # overrides any larger client request via the CONNACK "Server Keep Alive"
    # property. UA Cloud Publisher asks for 100s (see MQTTClient.cs) and keeps
    # pinging on that schedule, so the broker stops seeing PINGREQ in time and
    # evicts the session with a clean "NormalDisconnection" every ~30s. Allow the
    # longer interval so long-lived publisher sessions are not torn down.
    max_keepalive 120
    # TLS + username/password authentication are enabled. For production,
    # replace the self-signed certificates with ones from a trusted CA.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      initContainers:
        - name: init-chown-data
          image: busybox:1.36
          imagePullPolicy: Always
          command: ["/bin/sh", "-c", "chown -R 1883:1883 /mosquitto/data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: mosquitto-data
              mountPath: /mosquitto/data
        - name: gen-certs
          image: alpine/openssl:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cd /certs
              # Self-signed CA
              openssl req -new -x509 -days 3650 -nodes \
                -subj "/CN=Mosquitto Demo CA" \
                -keyout ca.key -out ca.crt
              # Server key + CSR
              openssl genrsa -out server.key 2048
              openssl req -new -key server.key \
                -subj "/CN=mosquitto.cloud.svc.cluster.local" \
                -out server.csr
              # Sign the server cert with SANs for in-cluster and local access
              printf "subjectAltName=DNS:mosquitto,DNS:mosquitto.cloud,DNS:mosquitto.cloud.svc,DNS:mosquitto.cloud.svc.cluster.local,DNS:localhost,IP:127.0.0.1\n" > san.cnf
              openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key \
                -CAcreateserial -days 3650 -out server.crt -extfile san.cnf
              chmod 644 ca.crt server.crt server.key
          volumeMounts:
            - name: mosquitto-certs
              mountPath: /certs
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0.18
          imagePullPolicy: Always
          env:
            - name: MOSQUITTO_USERNAME
              value: "${IOT_USERNAME}"
            - name: MOSQUITTO_PASSWORD
              value: "${IOT_PASSWORD}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # Generate the password file, then hand it to the uid the broker drops
              # privileges to. mosquitto.conf has no "user" directive, so Mosquitto 2.0
              # switches to the "mosquitto" user (uid/gid 1883) AFTER reading the config
              # and re-opens password_file as that user. mosquitto_passwd creates the
              # file 0600 owned by whoever runs this script, so without the chown/chmod
              # below the broker fails with:
              #   Error: Unable to open pwfile "/mosquitto/data/passwd".
              mosquitto_passwd -b -c /mosquitto/data/passwd "$MOSQUITTO_USERNAME" "$MOSQUITTO_PASSWORD"
              chown 1883:1883 /mosquitto/data/passwd || true
              chmod 0640 /mosquitto/data/passwd
              exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
          ports:
            - containerPort: 8883
              name: mqtts
          volumeMounts:
            - name: mosquitto-conf
              mountPath: /mosquitto/config
            - name: mosquitto-data
              mountPath: /mosquitto/data
            - name: mosquitto-certs
              mountPath: /mosquitto/certs
          livenessProbe:
            tcpSocket:
              port: mqtts
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: mqtts
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: mosquitto-conf
          configMap:
            name: mosquitto-conf
            items:
              - key: mosquitto.conf
                path: mosquitto.conf
        - name: mosquitto-data
          hostPath:
            path: "/mosquitto"
        - name: mosquitto-certs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: cloud
spec:
  type: LoadBalancer
  selector:
    app: mosquitto
  ports:
    - name: mqtts
      port: 8883
      targetPort: 8883
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: influxdb
  namespace: cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: influxdb
  template:
    metadata:
      labels:
        app: influxdb
    spec:
      containers:
        - name: influxdb
          image: influxdb:2.7
          imagePullPolicy: Always
          ports:
            - containerPort: 8086
              name: http
          env:
            # Optional first-run setup via env vars (if not using the UI)
            - name: INFLUXD_REPORTING_DISABLED
              value: "true"
            - name: DOCKER_INFLUXDB_INIT_MODE
              value: "setup"
            - name: DOCKER_INFLUXDB_INIT_USERNAME
              value: "${IOT_USERNAME}"
            - name: DOCKER_INFLUXDB_INIT_PASSWORD
              value: "${IOT_PASSWORD}"
            - name: DOCKER_INFLUXDB_INIT_ORG
              value: "iot"
            - name: DOCKER_INFLUXDB_INIT_BUCKET
              value: "mqtt"
            - name: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: influxdb-auth
                  key: INFLUX_TOKEN
          volumeMounts:
            - name: data
              mountPath: /var/lib/influxdb2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: "data"
          hostPath:
            path: "/influxdb2"
---
apiVersion: v1
kind: Service
metadata:
  name: influxdb
  namespace: cloud
spec:
  type: LoadBalancer
  selector:
    app: influxdb
  ports:
    - name: http
      port: 8086
      targetPort: 8086
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegraf
  namespace: cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegraf
  template:
    metadata:
      labels:
        app: telegraf
    spec:
      initContainers:
        - name: wait-for-mosquitto
          image: busybox:1.36
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for mosquitto:8883 (max 300s) ..."
              timeout 300 sh -c 'until nc -z -w 2 mosquitto 8883; do sleep 5; done' \
                && echo "Mosquitto is up" \
                || echo "WARNING: mosquitto:8883 not reachable - starting anyway"
              exit 0
      containers:
        - name: telegraf
          image: telegraf:1.37-alpine
          imagePullPolicy: Always
          env:
            - name: INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: influxdb-auth
                  key: INFLUX_TOKEN
          volumeMounts:
            - name: telegraf-conf
              mountPath: /etc/telegraf
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pgrep telegraf >/dev/null || exit 1"]
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "telegraf --version >/dev/null 2>&1"]
            initialDelaySeconds: 5
            periodSeconds: 20
      volumes:
        - name: telegraf-conf
          configMap:
            name: telegraf-conf
            items:
              - key: telegraf.conf
                path: telegraf.conf
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portainer-sa-clusteradmin
  namespace: cloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portainer-crb-clusteradmin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: portainer-sa-clusteradmin
  namespace: cloud
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portainer
  namespace: cloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: portainer
  template:
    metadata:
      labels:
        app: portainer
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      # Grants Portainer in-cluster access to the K3s API server to manage the cluster
      serviceAccountName: portainer-sa-clusteradmin
      containers:
      - name: portainer
        image: portainer/portainer-ce:2.21.4
        imagePullPolicy: Always
        args:
        # Use the in-cluster (Kubernetes) environment as the default endpoint
        - "--tunnel-port=8000"
        ports:
        - name: http
          containerPort: 9000
        - name: https
          containerPort: 9443
        - name: tunnel
          containerPort: 8000
        volumeMounts:
        - name: data
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /
            port: 9443
            scheme: HTTPS
          initialDelaySeconds: 20
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 9443
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 20
      volumes:
        - name: data
          hostPath:
            path: "/portainer"
---
apiVersion: v1
kind: Service
metadata:
  name: portainer
  namespace: cloud
spec:
  type: LoadBalancer
  selector:
    app: portainer
  ports:
    - name: https
      port: 9443
      targetPort: 9443
    - name: http
      port: 9000
      targetPort: 9000
    - name: tunnel
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: cloud
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: InfluxDB
        # The uid is referenced by every provisioned dashboard panel
        # ("datasource": { "type": "influxdb", "uid": "influxdb" }). Without an
        # explicit uid Grafana generates a random one and the panels resolve to a
        # non-existent datasource, so they render empty with no query ever issued.
        uid: influxdb
        type: influxdb
        access: proxy
        url: http://influxdb.cloud.svc.cluster.local:8086
        isDefault: true
        jsonData:
          version: Flux
          organization: iot
          defaultBucket: mqtt
          tlsSkipVerify: true
        secureJsonData:
          # Interpolated from the INFLUX_TOKEN environment variable at startup
          token: $INFLUX_TOKEN
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: cloud
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: cloud
data:
  production-line-oee.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "title": "Production Line OEE",
      "uid": "production-line-oee",
      "tags": [
        "opcua",
        "oee",
        "manufacturing"
      ],
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "station",
            "label": "Station",
            "type": "custom",
            "query": "assembly,test,packaging",
            "current": {
              "text": "assembly",
              "value": "assembly",
              "selected": true
            },
            "options": [
              {
                "text": "assembly",
                "value": "assembly",
                "selected": true
              },
              {
                "text": "test",
                "value": "test",
                "selected": false
              },
              {
                "text": "packaging",
                "value": "packaging",
                "selected": false
              }
            ],
            "includeAll": false,
            "multi": false
          }
        ]
      },
      "panels": [
        {
          "id": 10,
          "title": "OEE - assembly",
          "type": "gauge",
          "datasource": {
            "type": "influxdb",
            "uid": "influxdb"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 50
                  },
                  {
                    "color": "green",
                    "value": 75
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "influxdb",
                "uid": "influxdb"
              },
              "query": "import \"strings\"\nimport \"array\"\n\nstation          = \"assembly\"\nidealCycleTimeMs = 6000.0\nbucket           = \"mqtt\"\n\nstart = v.timeRangeStart\nstop  = v.timeRangeStop\n\nidealRunningTimeMs = float(v: int(v: stop) - int(v: start)) / 1000000.0\n\nwriters =\n  from(bucket: bucket)\n\t|\u003e range(start: -30d)\n\t|\u003e filter(fn: (r) =\u003e r._measurement == \"opcua_metadata\")\n\t|\u003e filter(fn: (r) =\u003e strings.containsStr(v: r.metaName, substr: station))\n\t|\u003e keep(columns: [\"datasetWriterId\"])\n\t|\u003e group()\n\t|\u003e distinct(column: \"datasetWriterId\")\n\t|\u003e findColumn(fn: (key) =\u003e true, column: \"_value\")\n\nseries = (field) =\u003e\n  from(bucket: bucket)\n\t|\u003e range(start: start, stop: stop)\n\t|\u003e filter(fn: (r) =\u003e r._measurement == \"opcua_pubsub\" and r._field == field)\n\t|\u003e filter(fn: (r) =\u003e contains(value: r.datasetWriterId, set: writers))\n\t|\u003e map(fn: (r) =\u003e ({r with _value: float(v: r._value)}))\n\t|\u003e group()\n\nscalar = (tables=\u003c-, fn) =\u003e\n  (tables\n\t|\u003e fn()\n\t|\u003e findRecord(fn: (key) =\u003e true, idx: 0))._value\n\nproducedField = \"Payload_NumberOfManufacturedProducts_Value\"\nscrappedField = \"Payload_NumberOfDiscardedProducts_Value\"\n\nproduced = scalar(tables: series(field: producedField), fn: max)\n\t\t - scalar(tables: series(field: producedField), fn: min)\nscrapped = scalar(tables: series(field: scrappedField), fn: max)\n\t\t - scalar(tables: series(field: scrappedField), fn: min)\n\nfaultyMs = scalar(tables: series(field: \"Payload_FaultyTime_Value\"), fn: sum)\n\nrunTimeMs   = idealRunningTimeMs - faultyMs\ntotalPieces = produced + scrapped\n\navailability = if idealRunningTimeMs \u003e 0.0 then runTimeMs / idealRunningTimeMs else 0.0\nperformance  = if runTimeMs \u003e 0.0 and totalPieces \u003e 0.0 then idealCycleTimeMs * totalPieces / runTimeMs else 0.0\nquality      = if totalPieces \u003e 0.0 then produced / totalPieces else 0.0\n\narray.from(rows: [{_time: stop, _field: \"OEE\", _value: availability * performance * quality * 100.0}])\n"
            }
          ]
        },
        {
          "id": 18,
          "title": "OEE - test",
          "type": "gauge",
          "datasource": {
            "type": "influxdb",
            "uid": "influxdb"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 50
                  },
                  {
                    "color": "green",
                    "value": 75
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "influxdb",
                "uid": "influxdb"
              },
